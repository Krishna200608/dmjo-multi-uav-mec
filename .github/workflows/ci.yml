name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Syntax and bytecode compilation
      run: |
        python -m compileall config.py train.py plot_ieee.py test_custom.py src

    - name: Run test suite
      run: |
        pytest tests -v

    - name: Run training smoke test
      run: |
        python train.py --method MAPPO --ablation full --total-steps 2 --device cpu --no-training-video --smoke-test
